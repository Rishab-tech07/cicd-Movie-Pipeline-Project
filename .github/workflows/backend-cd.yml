name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'cluster' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock
      - run: python -m pip install pipenv
      - run: pipenv sync --dev
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock
      - run: python -m pip install pipenv
      - run: pipenv sync --dev
      - run: pipenv run test

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    env:
      ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          test -n "$ECR_REPOSITORY" || { echo "Set the BACKEND_ECR_REPOSITORY Actions variable to the backend ECR repository URL."; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build \
            --tag "$ECR_REPOSITORY:${GITHUB_SHA}" \
            starter/backend
          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image "backend=$ECR_REPOSITORY:${GITHUB_SHA}"
          kustomize build | kubectl apply -f -
